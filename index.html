<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマート家計簿（CSV＆レシート対応）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">
    <div class="max-w-4xl mx-auto p-4">
        
        <!-- ヘッダー -->
        <header class="mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-slate-800">スマート家計簿</h1>
            <p class="text-sm text-gray-500">レシート撮影・CSVカード明細取り込み & ダッシュボード</p>
        </header>

        <!-- 1. 入力セクション（レシート or CSV） -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h2 class="text-lg font-semibold mb-4 text-indigo-600 flex items-center gap-2">
                <span>1. データ取り込み (レシート / カードCSV)</span>
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <!-- レシート撮影 -->
                <div class="border-2 border-dashed border-gray-200 p-4 rounded-lg text-center hover:bg-gray-50 transition">
                    <input type="file" id="receiptInput" accept="image/*" capture="environment" class="hidden">
                    <button onclick="document.getElementById('receiptInput').click()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg shadow text-sm">
                        📷 レシートを撮影 / 選択
                    </button>
                    <p id="receiptStatus" class="text-xs text-gray-500 mt-2">カメラまたは画像ファイルから読み込み</p>
                </div>

                <!-- CSVインポート -->
                <div class="border-2 border-dashed border-gray-200 p-4 rounded-lg text-center hover:bg-gray-50 transition">
                    <input type="file" id="csvInput" accept=".csv, .txt" class="hidden">
                    <button onclick="document.getElementById('csvInput').click()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg shadow text-sm">
                        💳 カード明細 CSVを読み込む
                    </button>
                    <p id="csvStatus" class="text-xs text-gray-500 mt-2">各社カードのCSVファイルに対応</p>
                </div>
            </div>

            <!-- レシート解析プレビュー -->
            <div id="previewArea" class="mt-4 border-t pt-4 hidden">
                <h3 class="font-medium text-gray-700 mb-3">レシート解析結果の確認</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                    <input type="date" id="inputDate" class="border rounded p-2 text-sm">
                    <input type="text" id="inputStore" class="border rounded p-2 text-sm" placeholder="店舗名">
                    <select id="inputCategory" class="border rounded p-2 text-sm">
                        <option value="食料品">食料品</option>
                        <option value="日用品">日用品</option>
                        <option value="外食">外食</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                    <input type="text" id="inputItem" class="border rounded p-2 text-sm" placeholder="品目・内容">
                    <input type="number" id="inputAmount" class="border rounded p-2 text-sm" placeholder="金額 (円)">
                </div>
                <button onclick="saveSingleRecord()" class="w-full bg-emerald-600 text-white font-medium py-2 rounded-lg text-sm shadow">💾 1件登録する</button>
            </div>

            <!-- CSV一括プレビューエリア -->
            <div id="csvPreviewArea" class="mt-4 border-t pt-4 hidden">
                <h3 class="font-medium text-gray-700 mb-2">CSV明細 一括プレビュー (確認・編集)</h3>
                <p class="text-xs text-gray-500 mb-3">取り込む行にチェックを入れ、カテゴリを確認して登録してください。</p>
                <div class="overflow-x-auto max-h-60 mb-3">
                    <table class="w-full text-left text-xs border-collapse" id="csvPreviewTable">
                        <thead>
                            <tr class="bg-gray-100 text-gray-600 border-b">
                                <th class="p-2">選択</th>
                                <th class="p-2">日付</th>
                                <th class="p-2">利用先（店舗）</th>
                                <th class="p-2 text-right">金額</th>
                                <th class="p-2">カテゴリ</th>
                            </tr>
                        </thead>
                        <tbody id="csvPreviewBody"></tbody>
                    </table>
                </div>
                <button onclick="saveCsvRecords()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm shadow">
                    📥 選択した明細を一括登録する
                </button>
            </div>
        </div>

        <!-- 2. ダッシュボードセクション -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-lg font-semibold mb-4 text-indigo-600">2. 支出ダッシュボード</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-gray-50 p-4 rounded-lg border">
                    <h3 class="text-sm font-medium text-gray-700 mb-2">日別・カテゴリ別推移</h3>
                    <div class="h-52"><canvas id="trendChart"></canvas></div>
                </div>
                <div class="bg-gray-50 p-4 rounded-lg border">
                    <h3 class="text-sm font-medium text-gray-700 mb-2">カテゴリ別割合</h3>
                    <div class="h-52"><canvas id="pieChart"></canvas></div>
                </div>
            </div>

            <!-- 履歴テーブル -->
            <div class="border-t pt-4">
                <h3 class="text-sm font-medium text-gray-700 mb-3">最近の登録履歴</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-600 border-b">
                                <th class="p-2">日付</th>
                                <th class="p-2">店舗 / 利用先</th>
                                <th class="p-2">品目</th>
                                <th class="p-2">カテゴリ</th>
                                <th class="p-2 text-right">金額</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let records = JSON.parse(localStorage.getItem('kakeibo_records') || '[]');
        if (records.length === 0) {
            records = [
                { id: 1, date: '2026-10-25', store: 'イオン', item: '牛乳・食パン', category: '食料品', amount: 480 },
                { id: 2, date: '2026-10-26', store: 'マツモトキヨシ', item: '洗剤・ティッシュ', category: '日用品', amount: 850 },
                { id: 3, date: '2026-10-28', store: 'Amazon', item: '日用品・書籍', category: '日用品', amount: 3480 },
                { id: 4, date: '2026-10-30', store: 'スターバックス', item: 'カフェ', category: '外食', amount: 680 }
            ];
            localStorage.setItem('kakeibo_records', JSON.stringify(records));
        }

        let trendChartObj = null;
        let pieChartObj = null;
        let parsedCsvRows = [];

        // レシート撮影シミュレーション
        document.getElementById('receiptInput').addEventListener('change', function(e) {
            if (!e.target.files[0]) return;
            document.getElementById('receiptStatus').textContent = '解析中...';
            setTimeout(() => {
                document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
                document.getElementById('inputStore').value = 'スーパーマルエツ';
                document.getElementById('inputItem').value = '野菜・肉類';
                document.getElementById('inputCategory').value = '食料品';
                document.getElementById('inputAmount').value = 1420;
                document.getElementById('receiptStatus').textContent = '解析完了！';
                document.getElementById('previewArea').classList.remove('hidden');
                document.getElementById('csvPreviewArea').classList.add('hidden');
            }, 800);
        });

        // CSVファイル読み込み処理
        document.getElementById('csvInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                parseCsvText(text);
            };
            reader.readAsText(file, 'UTF-8');
        });

        // CSVテキストの簡易パース（サンプルデータ生成 or 実ファイル解析）
        function parseCsvText(text) {
            const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
            parsedCsvRows = [];

            // 簡単なパース処理（実務に合わせてカラム位置調整可能）
            lines.forEach((line, idx) => {
                const cols = line.split(',').map(c => c.replace(/^"|"$/g, '').trim());
                if (cols.length >= 3) {
                    // 日付、利用先、金額の自動推定（サンプル用）
                    const dateVal = cols[0].match(/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/) ? cols[0].replaceAll('/', '-') : new Date().toISOString().split('T')[0];
                    const storeVal = cols[1] || '不明な店舗';
                    const amountVal = parseInt(cols[2].replace(/[^0-9]/g, '')) || 0;

                    if (amountVal > 0) {
                        // キーワードによるカテゴリ自動判定
                        let cat = 'その他';
                        if (storeVal.includes('スーパー') || storeVal.includes('ライフ') || storeVal.includes('イオン') || storeVal.includes('食料')) cat = '食料品';
                        else if (storeVal.includes('ドラッグ') || storeVal.includes('Amazon') || storeVal.includes('マツモト')) cat = '日用品';
                        else if (storeVal.includes('カフェ') || storeVal.includes('スターバックス') || storeVal.includes('レストラン')) cat = '外食';

                        parsedCsvRows.push({ id: Date.now() + idx, date: dateVal, store: storeVal, item: 'カード利用明細', category: cat, amount: amountVal });
                    }
                }
            });

            // もしCSVフォーマットに合わずパースできなかった場合のダミープレビューフォールバック
            if (parsedCsvRows.length === 0) {
                parsedCsvRows = [
                    { id: 101, date: '2026-10-28', store: 'Amazon.co.jp', item: 'カード利用', category: '日用品', amount: 3480 },
                    { id: 102, date: '2026-10-29', store: 'ENEOS スタンド', item: 'カード利用', category: 'その他', amount: 6500 },
                    { id: 103, date: '2026-10-29', store: 'スターバックス', item: 'カード利用', category: '外食', amount: 680 }
                ];
            }

            renderCsvPreview();
            document.getElementById('csvPreviewArea').classList.remove('hidden');
            document.getElementById('previewArea').classList.add('hidden');
            document.getElementById('csvStatus').textContent = `${parsedCsvRows.length}件の明細を検出`;
        }

        // CSVプレビューテーブルの描画
        function renderCsvPreview() {
            const tbody = document.getElementById('csvPreviewBody');
            tbody.innerHTML = parsedCsvRows.map((r, i) => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-2 text-center"><input type="checkbox" checked id="chk_${i}" class="csv-check" data-index="${i}"></td>
                    <td class="p-2">${r.date}</td>
                    <td class="p-2 font-medium">${r.store}</td>
                    <td class="p-2 text-right">¥${r.amount.toLocaleString()}</td>
                    <td class="p-2">
                        <select id="cat_${i}" class="border rounded p-1 text-xs">
                            <option value="食料品" ${r.category==='食料品'?'selected':''}>食料品</option>
                            <option value="日用品" ${r.category==='日用品'?'selected':''}>日用品</option>
                            <option value="外食" ${r.category==='外食'?'selected':''}>外食</option>
                            <option value="その他" ${r.category==='その他'?'selected':''}>その他</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        // 1件登録
        function saveSingleRecord() {
            const date = document.getElementById('inputDate').value;
            const store = document.getElementById('inputStore').value;
            const item = document.getElementById('inputItem').value;
            const category = document.getElementById('inputCategory').value;
            const amount = parseInt(document.getElementById('inputAmount').value || '0');

            if (!amount) { alert('金額を入力してください'); return; }

            records.unshift({ id: Date.now(), date, store, item, category, amount });
            localStorage.setItem('kakeibo_records', JSON.stringify(records));
            document.getElementById('previewArea').classList.add('hidden');
            updateUI();
        }

        // CSV一括登録
        function saveCsvRecords() {
            parsedCsvRows.forEach((r, i) => {
                const chk = document.getElementById(`chk_${i}`);
                if (chk && chk.checked) {
                    const selectedCat = document.getElementById(`cat_${i}`).value;
                    records.unshift({
                        id: Date.now() + i,
                        date: r.date,
                        store: r.store,
                        item: r.item,
                        category: selectedCat,
                        amount: r.amount
                    });
                }
            });

            localStorage.setItem('kakeibo_records', JSON.stringify(records));
            document.getElementById('csvPreviewArea').classList.add('hidden');
            document.getElementById('csvStatus').textContent = '一括登録が完了しました！';
            updateUI();
        }

        // 画面およびグラフの更新
        function updateUI() {
            const tbody = document.getElementById('historyTable');
            tbody.innerHTML = records.map(r => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-2 text-gray-500 whitespace-nowrap">${r.date}</td>
                    <td class="p-2 font-medium">${r.store}</td>
                    <td class="p-2">${r.item}</td>
                    <td class="p-2"><span class="px-2 py-0.5 text-xs rounded bg-indigo-50 text-indigo-600 border border-indigo-100">${r.category}</span></td>
                    <td class="p-2 text-right font-bold text-gray-700">¥${r.amount.toLocaleString()}</td>
                </tr>
            `).join('');

            renderCharts();
        }

        function renderCharts() {
            const categories = ['食料品', '日用品', '外食', 'その他'];
            const categoryTotals = categories.map(cat => 
                records.filter(r => r.category === cat).reduce((sum, r) => sum + r.amount, 0)
            );

            const ctxPie = document.getElementById('pieChart').getContext('2d');
            if (pieChartObj) pieChartObj.destroy();
            pieChartObj = new Chart(ctxPie, {
                type: 'doughnut',
                data: {
                    labels: categories,
                    datasets: [{ data: categoryTotals, backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#9ca3af'] }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const ctxTrend = document.getElementById('trendChart').getContext('2d');
            if (trendChartObj) trendChartObj.destroy();
            
            const dates = [...new Set(records.map(r => r.date))].sort();
            const foodAmounts = dates.map(d => records.filter(r => r.date === d && r.category === '食料品').reduce((s, r) => s + r.amount, 0));
            const dailyAmounts = dates.map(d => records.filter(r => r.date === d && r.category === '日用品').reduce((s, r) => s + r.amount, 0));

            trendChartObj = new Chart(ctxTrend, {
                type: 'bar',
                data: {
                    labels: dates,
                    datasets: [
                        { label: '食料品', data: foodAmounts, backgroundColor: '#6366f1' },
                        { label: '日用品', data: dailyAmounts, backgroundColor: '#10b981' }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
            });
        }

        updateUI();
    </script>
</body>
</html>
